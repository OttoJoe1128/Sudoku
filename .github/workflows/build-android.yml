name: Build Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Manuel tetikleme butonu ekler

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17 Kur (Android için gerekli)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Web Dosyalarını Hazırla
        run: |
          mkdir www
          # Sadece oyun dosyalarını www klasörüne kopyala
          cp index.html sw.js manifest.json *.png www/ 2>/dev/null || :

      - name: Capacitor & Android Projesini Oluştur
        run: |
          npm init -y
          npm i @capacitor/core
          npm i -D @capacitor/cli @capacitor/android
          npx cap init "SudokuMap" "com.sudokumap.app" --web-dir www
          npx cap add android
          npx cap sync

      - name: APK ve AAB Dosyalarını Derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleDebug

      - name: Çıktıları İndirmeye Sun
        uses: actions/upload-artifact@v4
        with:
          name: SudokuApp-Android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/debug/app-debug.aab
