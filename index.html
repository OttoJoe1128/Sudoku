<!DOCTYPE html>
<html lang="tr">
<head>
    <!-- PWA Meta Etiketleri -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="icon-192.png">  

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sudoku Yolculuğu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            -webkit-tap-highlight-color: transparent;
        }

        .hidden-scrollbar::-webkit-scrollbar { display: none; }
        .hidden-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(9, 1fr);
            width: 100%;
            aspect-ratio: 1;
            background-color: #1e293b;
            gap: 1px;
            border: 3px solid #1e293b;
            border-radius: 8px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
        }
        
        .sudoku-cell {
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(1.2rem, 6vw, 1.75rem);
            cursor: pointer;
            user-select: none;
            transition: background-color 0.15s, box-shadow 0.15s;
            font-weight: 700;
        }

        .sudoku-cell[data-col="2"], .sudoku-cell[data-col="5"] { border-right: 2px solid #1e293b; }
        .sudoku-cell[data-row="2"], .sudoku-cell[data-row="5"] { border-bottom: 2px solid #1e293b; }

        .cell-selected {
            background-color: #e0e7ff !important;
            box-shadow: inset 0 0 0 3px #4f46e5 !important;
            z-index: 10;
        }

        @keyframes error-shake {
            0% { transform: translateX(0); }
            20% { transform: translateX(-4px) scale(1.05); }
            40% { transform: translateX(4px) scale(1.05); }
            60% { transform: translateX(-4px) scale(1.05); }
            80% { transform: translateX(4px) scale(1.05); }
            100% { transform: translateX(0); }
        }

        .animate-error {
            animation: error-shake 0.4s ease-in-out;
            background-color: #fee2e2 !important; 
            color: #dc2626 !important; 
            z-index: 20;
        }

        .tap-effect:active { transform: scale(0.92); }
    </style>

    <!-- FİREBASE BAĞLANTISI (MODÜL) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDocs, collection, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAujJkjhPlSUPkBUbZ-XTMw6fKmCUFhLuQ",
            authDomain: "sudokumap.firebaseapp.com",
            projectId: "sudokumap",
            storageBucket: "sudokumap.firebasestorage.app",
            messagingSenderId: "725064430422",
            appId: "1:725064430422:web:8b73102facc0f368a4dcf7",
            measurementId: "G-HTDJ1GLMN9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Veri Kaydetme Fonksiyonu
        window.dbSaveProgress = async function(username, level, gold) {
            if(!username) return;
            try {
                await setDoc(doc(db, "leaderboard", username), {
                    username: username,
                    level: level,
                    gold: gold,
                    updatedAt: new Date()
                });
            } catch(e) {
                console.error("Firebase kayıt hatası:", e);
            }
        };

        // Liderlik Tablosunu Getirme Fonksiyonu
        window.dbGetLeaderboard = async function() {
            try {
                // Önce seviyeye, sonra altına göre sırala. İlk 50'yi getir.
                const q = query(collection(db, "leaderboard"), orderBy("level", "desc"), orderBy("gold", "desc"), limit(50));
                const querySnapshot = await getDocs(q);
                let list = [];
                querySnapshot.forEach((doc) => {
                    list.push(doc.data());
                });
                return list;
            } catch(e) {
                console.error("Firebase çekme hatası:", e);
                return [];
            }
        };

        // Sayfa yüklendiğinde mevcut oyuncu varsa sessizce arka planda bilgilerini güncelle
        setTimeout(() => {
            const savedUsername = localStorage.getItem('sudoku_username');
            const lvl = parseInt(localStorage.getItem('sudoku_level')) || 1;
            let gld = parseInt(localStorage.getItem('sudoku_gold'));
            gld = isNaN(gld) ? 100 : gld;
            if(savedUsername) {
                window.dbSaveProgress(savedUsername, lvl, gld);
            }
        }, 2000);
    </script>
</head>

    <script>
        const TOTAL_LEVELS = 1000;
        
        let currentLevel = parseInt(localStorage.getItem('sudoku_level')) || 1;
        let storedGold = localStorage.getItem('sudoku_gold');
        let userGold = storedGold !== null ? parseInt(storedGold) : 100;
        let storedHints = localStorage.getItem('sudoku_free_hints');
        let freeHints = storedHints !== null ? parseInt(storedHints) : 5;

        let gameMode = null; 
        let playingLevelId = null; 
        let currentDifficultyStr = null; 

        let currentSolution = []; 
        let initialBoard = [];
        let userBoard = [];
        let selectedCell = null;
        
        let temporaryError = null; 
        let errorTimeout = null;

        function navigate(viewId) {
            document.getElementById('view-menu').classList.add('hidden');
            document.getElementById('view-map').classList.add('hidden');
            document.getElementById('view-custom').classList.add('hidden');
            
            document.getElementById('btn-back').classList.remove('hidden');
            document.getElementById('header-level-badge').classList.add('hidden');
            
            if(viewId === 'menu') {
                document.getElementById('view-menu').classList.remove('hidden');
                document.getElementById('btn-back').classList.add('hidden');
                document.getElementById('header-title').innerHTML = `Sudoku<span class="text-indigo-600">Map</span>`;
            } else if (viewId === 'map') {
                document.getElementById('view-map').classList.remove('hidden');
                document.getElementById('header-title').innerText = "Yolculuk";
                document.getElementById('header-level-badge').classList.remove('hidden');
                setTimeout(scrollToActiveNode, 100);
            } else if (viewId === 'custom') {
                document.getElementById('view-custom').classList.remove('hidden');
                document.getElementById('header-title').innerText = "Özel Oyun";
            }
            updateUI();
        }

        function updateUI() {
            document.getElementById('menu-level-text').innerText = currentLevel > TOTAL_LEVELS ? TOTAL_LEVELS : currentLevel;
            document.getElementById('header-level').innerText = currentLevel > TOTAL_LEVELS ? TOTAL_LEVELS : currentLevel;
            document.getElementById('header-gold').innerText = userGold;
            
            const uname = localStorage.getItem('sudoku_username');
            if(uname) document.getElementById('menu-player-name').innerText = uname;

            const hintStatus = document.getElementById('hint-status');
            if(freeHints > 0) {
                hintStatus.innerText = `${freeHints} Ücretsiz`;
                hintStatus.className = "bg-amber-700/40 px-2 py-1 rounded-lg text-xs font-bold tracking-wide text-white";
            } else {
                hintStatus.innerHTML = `🪙 20 Altın`;
                hintStatus.className = "bg-white text-amber-600 px-2 py-1 rounded-lg text-xs font-bold tracking-wide shadow-sm";
            }
        }

        // KULLANICI ADI KAYIT SİSTEMİ
        function saveUsername() {
            const input = document.getElementById('username-input').value.trim();
            if(input.length < 3) {
                alert("Lütfen en az 3 harfli bir ad girin!");
                return;
            }
            localStorage.setItem('sudoku_username', input);
            document.getElementById('username-modal').classList.add('hidden');
            document.getElementById('username-modal').classList.remove('flex');
            updateUI();
            
            if(window.dbSaveProgress) window.dbSaveProgress(input, currentLevel, userGold);
        }

        // LİDERLİK TABLOSU AÇ/KAPA
        async function openLeaderboard() {
            const modal = document.getElementById('leaderboard-modal');
            const listEl = document.getElementById('leaderboard-list');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            listEl.innerHTML = '<div class="text-center text-slate-400 py-10 font-bold animate-pulse">Liderler Yükleniyor...</div>';
            
            if(window.dbGetLeaderboard) {
                const data = await window.dbGetLeaderboard();
                if(data.length === 0) {
                    listEl.innerHTML = '<div class="text-center text-slate-400 py-10 font-bold">Henüz kimse yok. İlk sen ol!</div>';
                    return;
                }
                
                listEl.innerHTML = '';
                const myName = localStorage.getItem('sudoku_username');
                
                data.forEach((user, index) => {
                    let rankStr = `<span class="text-sm font-black text-slate-400 w-6 text-center">${index + 1}.</span>`;
                    if(index === 0) rankStr = '<span class="text-xl w-6 text-center drop-shadow-md">🥇</span>';
                    if(index === 1) rankStr = '<span class="text-xl w-6 text-center drop-shadow-md">🥈</span>';
                    if(index === 2) rankStr = '<span class="text-xl w-6 text-center drop-shadow-md">🥉</span>';

                    let isMe = user.username === myName;
                    let bgClass = isMe ? 'bg-indigo-50 border-indigo-200' : 'bg-white border-slate-100';
                    let nameColor = isMe ? 'text-indigo-700' : 'text-slate-700';

                    listEl.innerHTML += `
                        <div class="flex items-center justify-between p-3 rounded-xl border ${bgClass} shadow-sm">
                            <div class="flex items-center gap-3">
                                ${rankStr}
                                <span class="font-bold text-sm ${nameColor}">${user.username}</span>
                            </div>
                            <div class="flex items-center gap-5 text-right">
                                <span class="text-xs font-black text-indigo-600 w-6">${user.level}</span>
                                <span class="text-xs font-bold text-amber-600 w-10">${user.gold}</span>
                            </div>
                        </div>
                    `;
                });
            } else {
                listEl.innerHTML = '<div class="text-center text-red-400 py-10 font-bold">Sunucuya bağlanılamadı. Lütfen internetinizi kontrol edin.</div>';
            }
        }

        function closeLeaderboard() {
            document.getElementById('leaderboard-modal').classList.add('hidden');
            document.getElementById('leaderboard-modal').classList.remove('flex');
        }

        function getJourneyLevelConfig(id) {
            let diff = 'basit';
            if (id > 100 && id <= 500) diff = 'orta';
            else if (id > 500) diff = 'zor';
            return diff;
        }

        const SudokuGen = {
            generate: function(difficulty) {
                let board = Array(9).fill().map(() => Array(9).fill(0));
                this.fillDiagonal(board);
                this.solve(board);
                let puzzle = board.map(row => [...row]);
                let targetRemoves = difficulty === 'basit' ? 35 : difficulty === 'orta' ? 45 : 55;
                let positions = [];
                for(let r=0; r<9; r++) for(let c=0; c<9; c++) positions.push({r, c});
                positions.sort(() => Math.random() - 0.5);

                let removes = 0;
                for (let i = 0; i < positions.length && removes < targetRemoves; i++) {
                    let {r, c} = positions[i];
                    let backup = puzzle[r][c];
                    puzzle[r][c] = 0;
                    if (this.countSolutions(puzzle.map(row => [...row])) === 1) removes++;
                    else puzzle[r][c] = backup; 
                }
                return { solution: board, puzzle };
            },
            countSolutions: function(board) {
                let count = 0;
                function solveHelper(b) {
                    for(let r=0; r<9; r++) {
                        for(let c=0; c<9; c++) {
                            if(b[r][c] === 0) {
                                for(let num=1; num<=9; num++) {
                                    if(SudokuGen.isSafe(b, r, c, num)) {
                                        b[r][c] = num;
                                        solveHelper(b);
                                        if(count > 1) { b[r][c] = 0; return; }
                                        b[r][c] = 0;
                                    }
                                }
                                return;
                            }
                        }
                    }
                    count++;
                }
                solveHelper(board);
                return count;
            },
            fillDiagonal: function(board) { for (let i = 0; i < 9; i += 3) this.fillBox(board, i, i); },
            fillBox: function(board, rowStart, colStart) {
                let num;
                for (let i = 0; i < 3; i++) {
                    for (let j = 0; j < 3; j++) {
                        do { num = Math.floor(Math.random() * 9) + 1; } 
                        while (!this.isSafeInBox(board, rowStart, colStart, num));
                        board[rowStart + i][colStart + j] = num;
                    }
                }
            },
            isSafeInBox: function(board, rowStart, colStart, num) {
                for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) if (board[rowStart + i][colStart + j] === num) return false;
                return true;
            },
            solve: function(board) {
                for (let r = 0; r < 9; r++) {
                    for (let c = 0; c < 9; c++) {
                        if (board[r][c] === 0) {
                            for (let num = 1; num <= 9; num++) {
                                if (this.isSafe(board, r, c, num)) {
                                    board[r][c] = num;
                                    if (this.solve(board)) return true;
                                    board[r][c] = 0;
                                }
                            }
                            return false; 
                        }
                    }
                }
                return true;
            },
            isSafe: function(board, r, c, num) {
                for (let i = 0; i < 9; i++) if (board[r][i] === num || board[i][c] === num) return false;
                let br = r - (r % 3); let bc = c - (c % 3);
                for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) if (board[br + i][bc + j] === num) return false;
                return true;
            }
        };

        function renderMap() {
            const container = document.getElementById('map-nodes');
            let htmlStr = '';

            for (let id = 1; id <= TOTAL_LEVELS; id++) {
                let diff = getJourneyLevelConfig(id);
                let isUnlocked = id <= currentLevel;
                let isCompleted = id < currentLevel;
                let isCurrent = id === currentLevel;
                
                let xOffset = id % 2 === 0 ? 'translate-x-[50px]' : '-translate-x-[50px]';
                let bgClass = isCompleted ? 'bg-emerald-500 text-white shadow-[0_4px_0_#059669]' : 
                              isCurrent ? 'bg-indigo-500 text-white shadow-[0_4px_0_#4f46e5] ring-4 ring-indigo-200 active-node' : 
                              'bg-slate-200 text-slate-400 shadow-[0_4px_0_#cbd5e1]';
                              
                let cursorClass = isUnlocked ? 'cursor-pointer hover:scale-105' : 'cursor-not-allowed opacity-70 grayscale';
                let icon = isCompleted ? `<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>` : id;
                
                htmlStr += `
                    <div class="relative flex justify-center w-full my-4" id="node-${id}">
                        <div class="${xOffset} flex flex-col items-center group transition-transform duration-300">
                            <button 
                                onclick="openJourneyLevel(${id})"
                                ${!isUnlocked ? 'disabled' : ''}
                                class="w-[70px] h-[70px] rounded-full flex items-center justify-center text-2xl font-black transition-all duration-300 ${bgClass} ${cursorClass}">
                                ${icon}
                            </button>
                            <span class="mt-3 text-[10px] font-bold text-slate-500 uppercase tracking-widest bg-white/90 px-3 py-1 rounded-full shadow-sm border border-slate-100">${diff}</span>
                        </div>
                    </div>
                `;
            }
            container.innerHTML = htmlStr;
        }

        function saveGameState() {
            if (!playingLevelId) return;
            const gameState = {
                levelId: playingLevelId,
                difficulty: currentDifficultyStr,
                initialBoard: initialBoard,
                userBoard: userBoard,
                currentSolution: currentSolution
            };
            
            if(gameMode === 'journey') localStorage.setItem('sudoku_saved_game', JSON.stringify(gameState));
            else localStorage.setItem('sudoku_custom_game', JSON.stringify(gameState));
        }

        function clearGameState() {
            if(gameMode === 'journey') localStorage.removeItem('sudoku_saved_game');
            else localStorage.removeItem('sudoku_custom_game');
        }

        function resetJourney() {
            if(confirm("Tüm harita ilerlemeni sıfırlamak istediğine emin misin? (Altınların da sıfırlanacak ama oyuncu adın kalacak)")) {
                localStorage.removeItem('sudoku_level');
                localStorage.removeItem('sudoku_gold');
                localStorage.removeItem('sudoku_free_hints');
                localStorage.removeItem('sudoku_saved_game');
                
                currentLevel = 1;
                userGold = 100;
                freeHints = 5;
                
                // Sıfırlamayı Firebase'e bildir
                let uname = localStorage.getItem('sudoku_username');
                if(uname && window.dbSaveProgress) window.dbSaveProgress(uname, currentLevel, userGold);
                
                updateUI();
                renderMap();
                setTimeout(scrollToActiveNode, 100);
            }
        }

        function openJourneyLevel(id) {
            gameMode = 'journey';
            playingLevelId = id;
            currentDifficultyStr = getJourneyLevelConfig(id);
            
            document.getElementById('modal-title').innerText = `Seviye ${id}`;
            document.getElementById('modal-difficulty').innerText = currentDifficultyStr;
            
            let isLoaded = false;
            const savedStr = localStorage.getItem('sudoku_saved_game');
            if (savedStr) {
                try {
                    const saved = JSON.parse(savedStr);
                    if (saved && saved.levelId === id) {
                        currentSolution = saved.currentSolution;
                        initialBoard = saved.initialBoard;
                        userBoard = saved.userBoard;
                        isLoaded = true;
                    }
                } catch (e) {}
            }
            
            if (!isLoaded) {
                let data = SudokuGen.generate(currentDifficultyStr);
                currentSolution = data.solution.map(r => [...r]);
                initialBoard = data.puzzle.map(r => [...r]);
                userBoard = data.puzzle.map(r => [...r]);
                saveGameState(); 
            }
            launchModal();
        }

        function openCustomGame(diff) {
            gameMode = 'custom';
            playingLevelId = 'custom';
            currentDifficultyStr = diff;

            document.getElementById('modal-title').innerText = `Özel Oyun`;
            document.getElementById('modal-difficulty').innerText = diff;

            let isLoaded = false;
            const savedStr = localStorage.getItem('sudoku_custom_game');
            if (savedStr) {
                try {
                    const saved = JSON.parse(savedStr);
                    if (saved && saved.difficulty === diff) {
                        if(confirm(`Yarım kalan bir "${diff}" oyununuz var. Devam etmek ister misiniz?\n(İptal derseniz yeni bir oyun başlar)`)) {
                            currentSolution = saved.currentSolution;
                            initialBoard = saved.initialBoard;
                            userBoard = saved.userBoard;
                            isLoaded = true;
                        } else {
                            localStorage.removeItem('sudoku_custom_game');
                        }
                    }
                } catch (e) {}
            }

            if (!isLoaded) {
                let data = SudokuGen.generate(diff);
                currentSolution = data.solution.map(r => [...r]);
                initialBoard = data.puzzle.map(r => [...r]);
                userBoard = data.puzzle.map(r => [...r]);
                saveGameState(); 
            }
            launchModal();
        }

        function launchModal() {
            selectedCell = null;
            temporaryError = null;
            updateUI();
            renderBoard();
            document.getElementById('sudoku-modal').classList.remove('hidden');
            document.getElementById('sudoku-modal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('sudoku-modal').classList.add('hidden');
            document.getElementById('sudoku-modal').classList.remove('flex');
            playingLevelId = null;
            selectedCell = null;
            if(errorTimeout) clearTimeout(errorTimeout);
            temporaryError = null;
        }

        function useHint() {
            let availableCells = [];
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    if (userBoard[r][c] !== currentSolution[r][c]) availableCells.push({r, c});
                }
            }
            if (availableCells.length === 0) return; 

            if (freeHints > 0) {
                freeHints--;
                localStorage.setItem('sudoku_free_hints', freeHints);
            } else if (userGold >= 20) {
                userGold -= 20;
                localStorage.setItem('sudoku_gold', userGold);
            } else {
                alert("İpucu almak için yeterli altınınız yok! (Oyun kazanarak altın elde edebilirsin)");
                return;
            }

            let randomCell = availableCells[Math.floor(Math.random() * availableCells.length)];
            let correctNum = currentSolution[randomCell.r][randomCell.c];
            
            initialBoard[randomCell.r][randomCell.c] = correctNum;
            userBoard[randomCell.r][randomCell.c] = correctNum;

            if (temporaryError && temporaryError.r === randomCell.r && temporaryError.c === randomCell.c) {
                temporaryError = null;
            }

            saveGameState(); 
            
            // Firebase'e altın düştüğünü bildir
            let uname = localStorage.getItem('sudoku_username');
            if(uname && window.dbSaveProgress) window.dbSaveProgress(uname, currentLevel, userGold);

            updateUI();
            renderBoard();

            setTimeout(() => {
                let isFull = userBoard.every(row => row.every(val => val !== 0));
                if(isFull) handleWin();
            }, 300);
        }

        function renderBoard() {
            const boardEl = document.getElementById('sudoku-board');
            boardEl.innerHTML = '';
            
            for(let r=0; r<9; r++) {
                for(let c=0; c<9; c++) {
                    let val = userBoard[r][c];
                    let isFixed = initialBoard[r][c] !== 0;
                    let isSelected = selectedCell && selectedCell.r === r && selectedCell.c === c;
                    let isTempError = temporaryError && temporaryError.r === r && temporaryError.c === c;
                    
                    let div = document.createElement('div');
                    div.className = 'sudoku-cell';
                    div.dataset.row = r;
                    div.dataset.col = c;
                    
                    if(val !== 0) div.innerText = val;
                    
                    if (isFixed) {
                        div.classList.add('text-slate-900', 'bg-slate-100/50');
                    } else {
                        div.classList.add('text-indigo-600');
                    }
                    
                    if (isTempError) {
                        div.classList.add('animate-error');
                        div.classList.remove('text-indigo-600');
                    } else if (isSelected) {
                        div.classList.add('cell-selected');
                    }
                    
                    div.onclick = () => {
                        if (isFixed) return;
                        selectedCell = {r, c};
                        renderBoard(); 
                    };
                    boardEl.appendChild(div);
                }
            }

            const numpad = document.getElementById('numpad-container');
            if(numpad) {
                if(selectedCell) numpad.classList.remove('opacity-50', 'pointer-events-none');
                else numpad.classList.add('opacity-50', 'pointer-events-none');
            }
        }

        function handleInput(num) {
            if(!selectedCell || initialBoard[selectedCell.r][selectedCell.c] !== 0) return; 
            
            let r = selectedCell.r;
            let c = selectedCell.c;

            if (num === 0) {
                userBoard[r][c] = 0;
                if(temporaryError && temporaryError.r === r && temporaryError.c === c) temporaryError = null;
                saveGameState(); 
                renderBoard();
                return;
            }

            if (num !== currentSolution[r][c]) {
                userBoard[r][c] = num;
                temporaryError = {r, c, num};
                
                if (navigator.vibrate) navigator.vibrate([50, 50, 50]);

                if(errorTimeout) clearTimeout(errorTimeout);
                renderBoard();

                errorTimeout = setTimeout(() => {
                    if (userBoard[r][c] === num) userBoard[r][c] = 0;
                    if (temporaryError && temporaryError.r === r && temporaryError.c === c) temporaryError = null;
                    saveGameState();
                    renderBoard();
                }, 1000);
            
            } else {
                userBoard[r][c] = num;
                if (temporaryError && temporaryError.r === r && temporaryError.c === c) temporaryError = null;
                
                saveGameState(); 
                renderBoard();
                
                setTimeout(() => {
                    let isFull = userBoard.every(row => row.every(val => val !== 0));
                    if(isFull) handleWin(); 
                }, 200);
            }
        }

        function handleWin() {
            confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 }, colors: ['#4f46e5', '#10b981', '#f59e0b'] });
            clearGameState(); 

            let reward = currentDifficultyStr === 'basit' ? 20 : (currentDifficultyStr === 'orta' ? 10 : 5);
            let winMessage = "";

            if (gameMode === 'journey') {
                let passedLevel = playingLevelId;
                winMessage = `Seviye ${passedLevel} başarıyla tamamlandı.`;
                
                if (passedLevel === currentLevel && currentLevel <= TOTAL_LEVELS) {
                    userGold += reward;
                    currentLevel++; 
                    localStorage.setItem('sudoku_level', currentLevel);
                    localStorage.setItem('sudoku_gold', userGold);
                } else {
                    reward = 0; 
                }
            } else {
                winMessage = `Özel Oyun (${currentDifficultyStr}) tamamlandı.`;
                userGold += reward; 
                localStorage.setItem('sudoku_gold', userGold);
            }
            
            // Verileri Firebase'e anında eşitle
            let uname = localStorage.getItem('sudoku_username');
            if(uname && window.dbSaveProgress) window.dbSaveProgress(uname, currentLevel, userGold);

            const boardEl = document.getElementById('sudoku-board');
            boardEl.innerHTML = `
                <div class="win-message flex flex-col items-center justify-center h-full w-full bg-emerald-50 rounded z-10 absolute inset-0">
                    <div class="text-6xl mb-3 drop-shadow-md">🎉</div>
                    <h3 class="text-3xl font-black mb-1 text-emerald-800">Harika!</h3>
                    <p class="font-semibold text-emerald-600 text-center px-4 mb-4">${winMessage}</p>
                    
                    ${reward > 0 ? `
                        <div class="bg-amber-100 text-amber-700 px-5 py-2.5 rounded-full font-black text-lg flex items-center gap-2 drop-shadow-sm animate-bounce">
                            🪙 +${reward} Altın
                        </div>
                    ` : ''}
                </div>
            `;
            
            setTimeout(() => {
                closeModal();
                if(gameMode === 'journey') {
                    renderMap();
                    setTimeout(scrollToActiveNode, 300);
                }
                updateUI();
            }, 3000); 
        }

        document.addEventListener('keydown', (e) => {
            const modal = document.getElementById('sudoku-modal');
            if(modal.classList.contains('hidden') || !selectedCell) return;
            
            if(e.key >= '1' && e.key <= '9') handleInput(parseInt(e.key));
            else if(e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') handleInput(0);
        });

        function scrollToActiveNode() {
            const activeNode = document.getElementById(`node-${currentLevel}`);
            if(activeNode) {
                activeNode.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Kullanıcı adı yoksa Modal'ı aç
            if(!localStorage.getItem('sudoku_username')) {
                document.getElementById('username-modal').classList.remove('hidden');
                document.getElementById('username-modal').classList.add('flex');
            }
            renderMap();
            navigate('menu'); 
        });
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .catch(err => console.error('SW hatası:', err));
            });
        }
    </script>
