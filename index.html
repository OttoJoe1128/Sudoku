<!DOCTYPE html>
<html lang="tr">
<head>
    <!-- PWA Meta Etiketleri -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="icon-192.png">  

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sudoku Yolculuğu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            -webkit-tap-highlight-color: transparent;
        }

        .hidden-scrollbar::-webkit-scrollbar { display: none; }
        .hidden-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Sudoku Izgarası */
        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(9, 1fr);
            width: 100%;
            aspect-ratio: 1;
            background-color: #1e293b;
            gap: 1px;
            border: 3px solid #1e293b;
            border-radius: 8px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
        }
        
        .sudoku-cell {
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(1.2rem, 6vw, 1.75rem);
            cursor: pointer;
            user-select: none;
            transition: all 0.1s ease;
            font-weight: 700;
        }

        /* 3x3 Kalın Çizgiler */
        .sudoku-cell[data-col="2"], .sudoku-cell[data-col="5"] { border-right: 2px solid #1e293b; }
        .sudoku-cell[data-row="2"], .sudoku-cell[data-row="5"] { border-bottom: 2px solid #1e293b; }

        /* Mavi Çerçeveli Seçili Hücre Animasyonu */
        .cell-selected {
            background-color: #e0e7ff !important;
            box-shadow: inset 0 0 0 3px #4f46e5 !important;
            z-index: 10;
        }

        /* Tıklama efekti */
        .tap-effect:active { transform: scale(0.92); }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen sm:p-6">

    <!-- Ana Uygulama Konteyneri -->
    <div class="w-full max-w-[480px] h-[100dvh] sm:h-[850px] bg-slate-50 relative overflow-hidden sm:rounded-[2.5rem] sm:shadow-[0_0_50px_rgba(0,0,0,0.5)] flex flex-col sm:border-[10px] sm:border-slate-800">
        
        <!-- Üst Bilgi (Header) -->
        <header class="bg-white/90 backdrop-blur-md px-5 py-4 flex justify-between items-center shadow-sm z-20 shrink-0 border-b border-slate-200">
            <h1 class="text-xl font-extrabold text-slate-800 tracking-tight">Sudoku<span class="text-indigo-600">Map</span></h1>
            
            <div class="flex items-center gap-2">
                <!-- Altın Göstergesi -->
                <div class="bg-amber-100 text-amber-700 px-3 py-1.5 rounded-full text-sm font-bold shadow-inner flex items-center gap-1.5">
                    <span class="text-lg leading-none">🪙</span>
                    <span id="header-gold">100</span>
                </div>
                
                <!-- Seviye Göstergesi -->
                <div class="bg-indigo-100 text-indigo-800 px-3 py-1.5 rounded-full text-sm font-bold shadow-inner flex gap-1">
                    Sv <span id="header-level">1</span><span class="text-indigo-400">/1000</span>
                </div>
            </div>
        </header>

        <!-- Harita Kaydırma Alanı -->
        <div id="map-scroll" class="flex-1 overflow-y-auto hidden-scrollbar relative bg-slate-50">
            <div class="absolute inset-0 opacity-[0.15] bg-[radial-gradient(circle_at_center,_#334155_2px,_transparent_2px)] bg-[size:24px_24px] pointer-events-none"></div>
            
            <div class="relative min-h-full py-16 flex flex-col-reverse justify-start items-center">
                <div class="absolute top-16 bottom-16 left-1/2 -ml-[6px] w-[12px] bg-indigo-200/50 rounded-full z-0"></div>
                
                <button onclick="resetGame()" class="z-10 mt-12 mb-4 text-xs font-semibold text-slate-400 hover:text-slate-600 transition-colors bg-white px-3 py-1 rounded-full shadow-sm border border-slate-200">
                    İlerlemeyi Sıfırla
                </button>

                <div id="map-nodes" class="relative z-10 flex flex-col-reverse w-full gap-6">
                    <!-- Javascript ile doldurulacak -->
                </div>
            </div>
        </div>

        <!-- Sudoku Oyun Modalı -->
        <div id="sudoku-modal" class="absolute inset-0 bg-slate-900/60 hidden flex-col items-center justify-center z-40 p-4 backdrop-blur-sm sm:rounded-[2rem]">
            <!-- Modal İçeriği -->
            <div class="bg-slate-50 rounded-3xl shadow-2xl p-4 sm:p-6 w-full max-w-[420px] flex flex-col items-center relative overflow-hidden transform transition-all border border-slate-200">
                
                <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 bg-white shadow-sm rounded-full p-2 transition-colors z-20">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>

                <div class="w-full flex justify-between items-end mb-4 pr-10">
                    <div>
                        <h2 class="text-2xl font-black text-slate-800 mb-1 mt-1">Seviye <span id="modal-level">1</span></h2>
                        <div class="inline-block px-3 py-1 bg-indigo-100 text-indigo-700 rounded-full text-[10px] font-bold uppercase tracking-widest" id="modal-difficulty">Basit</div>
                    </div>
                </div>
                
                <!-- Tahta -->
                <div id="sudoku-board" class="sudoku-grid mb-5 w-full shrink-0"></div>
                
                <!-- Numpad -->
                <div id="numpad-container" class="w-full grid grid-cols-5 gap-2 mb-4 opacity-50 pointer-events-none transition-opacity duration-300">
                    <button onclick="handleInput(1)" class="tap-effect h-12 bg-white rounded-xl font-black text-xl text-slate-700 shadow-[0_2px_0_rgba(203,213,225,1)] border border-slate-200 flex items-center justify-center">1</button>
                    <button onclick="handleInput(2)" class="tap-effect h-12 bg-white rounded-xl font-black text-xl text-slate-700 shadow-[0_2px_0_rgba(203,213,225,1)] border border-slate-200 flex items-center justify-center">2</button>
                    <button onclick="handleInput(3)" class="tap-effect h-12 bg-white rounded-xl font-black text-xl text-slate-700 shadow-[0_2px_0_rgba(203,213,225,1)] border border-slate-200 flex items-center justify-center">3</button>
                    <button onclick="handleInput(4)" class="tap-effect h-12 bg-white rounded-xl font-black text-xl text-slate-700 shadow-[0_2px_0_rgba(203,213,225,1)] border border-slate-200 flex items-center justify-center">4</button>
                    <button onclick="handleInput(5)" class="tap-effect h-12 bg-white rounded-xl font-black text-xl text-slate-700 shadow-[0_2px_0_rgba(203,213,225,1)] border border-slate-200 flex items-center justify-center">5</button>
                    <button onclick="handleInput(6)" class="tap-effect h-12 bg-white rounded-xl font-black text-xl text-slate-700 shadow-[0_2px_0_rgba(203,213,225,1)] border border-slate-200 flex items-center justify-center">6</button>
                    <button onclick="handleInput(7)" class="tap-effect h-12 bg-white rounded-xl font-black text-xl text-slate-700 shadow-[0_2px_0_rgba(203,213,225,1)] border border-slate-200 flex items-center justify-center">7</button>
                    <button onclick="handleInput(8)" class="tap-effect h-12 bg-white rounded-xl font-black text-xl text-slate-700 shadow-[0_2px_0_rgba(203,213,225,1)] border border-slate-200 flex items-center justify-center">8</button>
                    <button onclick="handleInput(9)" class="tap-effect h-12 bg-white rounded-xl font-black text-xl text-slate-700 shadow-[0_2px_0_rgba(203,213,225,1)] border border-slate-200 flex items-center justify-center">9</button>
                    <button onclick="handleInput(0)" class="tap-effect h-12 bg-red-50 rounded-xl font-bold text-sm text-red-600 shadow-[0_2px_0_rgba(254,202,202,1)] border border-red-200 flex items-center justify-center">Sil</button>
                </div>

                <!-- İpucu Butonu -->
                <div class="w-full">
                    <button onclick="useHint()" id="hint-btn" class="tap-effect w-full flex justify-between items-center px-4 py-3 bg-amber-500 text-white rounded-xl font-bold shadow-[0_4px_0_#d97706] active:shadow-[0_0px_0_#d97706] active:translate-y-1 transition-all">
                        <div class="flex items-center gap-2">
                            <span class="text-xl leading-none">💡</span>
                            <span>İpucu Kullan</span>
                        </div>
                        <span id="hint-status" class="bg-amber-700/40 px-2 py-1 rounded-lg text-xs font-bold tracking-wide">
                            5 Ücretsiz
                        </span>
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script>
        const TOTAL_LEVELS = 1000;
        
        function getLevelConfig(id) {
            let diff = 'basit';
            if (id > 100 && id <= 500) diff = 'orta';
            else if (id > 500) diff = 'zor';
            return { id, diff };
        }

        // --- VERİ VE DURUM YÖNETİMİ ---
        let currentLevel = parseInt(localStorage.getItem('sudoku_level')) || 1;
        
        let storedGold = localStorage.getItem('sudoku_gold');
        let userGold = storedGold !== null ? parseInt(storedGold) : 100;
        
        let storedHints = localStorage.getItem('sudoku_free_hints');
        let freeHints = storedHints !== null ? parseInt(storedHints) : 5;

        let playingLevelId = null;
        let currentSolution = []; 
        let initialBoard = [];
        let userBoard = [];
        let selectedCell = null;

        // Sudoku Motoru
        const SudokuGen = {
            generate: function(difficulty) {
                let board = Array(9).fill().map(() => Array(9).fill(0));
                this.fillDiagonal(board);
                this.solve(board);
                
                let puzzle = board.map(row => [...row]);
                let targetRemoves = difficulty === 'basit' ? 35 : difficulty === 'orta' ? 45 : 55;
                
                let positions = [];
                for(let r=0; r<9; r++) for(let c=0; c<9; c++) positions.push({r, c});
                positions.sort(() => Math.random() - 0.5);

                let removes = 0;
                for (let i = 0; i < positions.length && removes < targetRemoves; i++) {
                    let {r, c} = positions[i];
                    let backup = puzzle[r][c];
                    puzzle[r][c] = 0;
                    
                    let solutions = this.countSolutions(puzzle.map(row => [...row]));
                    if (solutions === 1) removes++;
                    else puzzle[r][c] = backup; 
                }
                return { solution: board, puzzle };
            },
            countSolutions: function(board) {
                let count = 0;
                function solveHelper(b) {
                    for(let r=0; r<9; r++) {
                        for(let c=0; c<9; c++) {
                            if(b[r][c] === 0) {
                                for(let num=1; num<=9; num++) {
                                    if(SudokuGen.isSafe(b, r, c, num)) {
                                        b[r][c] = num;
                                        solveHelper(b);
                                        if(count > 1) { b[r][c] = 0; return; }
                                        b[r][c] = 0;
                                    }
                                }
                                return;
                            }
                        }
                    }
                    count++;
                }
                solveHelper(board);
                return count;
            },
            fillDiagonal: function(board) {
                for (let i = 0; i < 9; i += 3) this.fillBox(board, i, i);
            },
            fillBox: function(board, rowStart, colStart) {
                let num;
                for (let i = 0; i < 3; i++) {
                    for (let j = 0; j < 3; j++) {
                        do { num = Math.floor(Math.random() * 9) + 1; } 
                        while (!this.isSafeInBox(board, rowStart, colStart, num));
                        board[rowStart + i][colStart + j] = num;
                    }
                }
            },
            isSafeInBox: function(board, rowStart, colStart, num) {
                for (let i = 0; i < 3; i++) {
                    for (let j = 0; j < 3; j++) {
                        if (board[rowStart + i][colStart + j] === num) return false;
                    }
                }
                return true;
            },
            solve: function(board) {
                for (let r = 0; r < 9; r++) {
                    for (let c = 0; c < 9; c++) {
                        if (board[r][c] === 0) {
                            for (let num = 1; num <= 9; num++) {
                                if (this.isSafe(board, r, c, num)) {
                                    board[r][c] = num;
                                    if (this.solve(board)) return true;
                                    board[r][c] = 0;
                                }
                            }
                            return false; 
                        }
                    }
                }
                return true;
            },
            isSafe: function(board, r, c, num) {
                for (let i = 0; i < 9; i++) {
                    if (board[r][i] === num || board[i][c] === num) return false;
                }
                let br = r - (r % 3);
                let bc = c - (c % 3);
                for (let i = 0; i < 3; i++) {
                    for (let j = 0; j < 3; j++) {
                        if (board[br + i][bc + j] === num) return false;
                    }
                }
                return true;
            }
        };

        // --- UI GÜNCELLEMELERİ ---
        function updateUI() {
            document.getElementById('header-level').innerText = currentLevel > TOTAL_LEVELS ? TOTAL_LEVELS : currentLevel;
            document.getElementById('header-gold').innerText = userGold;
            
            const hintStatus = document.getElementById('hint-status');
            if(freeHints > 0) {
                hintStatus.innerText = `${freeHints} Ücretsiz`;
                hintStatus.className = "bg-amber-700/40 px-2 py-1 rounded-lg text-xs font-bold tracking-wide text-white";
            } else {
                hintStatus.innerHTML = `🪙 20 Altın`;
                hintStatus.className = "bg-white text-amber-600 px-2 py-1 rounded-lg text-xs font-bold tracking-wide shadow-sm";
            }
        }

        function renderMap() {
            const container = document.getElementById('map-nodes');
            let htmlStr = '';
            updateUI();

            for (let id = 1; id <= TOTAL_LEVELS; id++) {
                let config = getLevelConfig(id);
                let isUnlocked = id <= currentLevel;
                let isCompleted = id < currentLevel;
                let isCurrent = id === currentLevel;
                
                let xOffset = id % 2 === 0 ? 'translate-x-[50px]' : '-translate-x-[50px]';
                let bgClass = isCompleted ? 'bg-emerald-500 text-white shadow-[0_4px_0_#059669]' : 
                              isCurrent ? 'bg-indigo-500 text-white shadow-[0_4px_0_#4f46e5] ring-4 ring-indigo-200 active-node' : 
                              'bg-slate-200 text-slate-400 shadow-[0_4px_0_#cbd5e1]';
                              
                let cursorClass = isUnlocked ? 'cursor-pointer hover:scale-105' : 'cursor-not-allowed opacity-70 grayscale';
                let icon = isCompleted ? `<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>` : id;
                
                htmlStr += `
                    <div class="relative flex justify-center w-full my-4" id="node-${id}">
                        <div class="${xOffset} flex flex-col items-center group transition-transform duration-300">
                            <button 
                                onclick="openLevel(${id})"
                                ${!isUnlocked ? 'disabled' : ''}
                                class="w-[70px] h-[70px] rounded-full flex items-center justify-center text-2xl font-black transition-all duration-300 ${bgClass} ${cursorClass}">
                                ${icon}
                            </button>
                            <span class="mt-3 text-[10px] font-bold text-slate-500 uppercase tracking-widest bg-white/90 px-3 py-1 rounded-full shadow-sm border border-slate-100">${config.diff}</span>
                        </div>
                    </div>
                `;
            }
            container.innerHTML = htmlStr;
        }

        // --- OYUN KAYIT SİSTEMİ (OFFLINE SAVE) ---
        function saveGameState() {
            if (!playingLevelId) return;
            const gameState = {
                levelId: playingLevelId,
                initialBoard: initialBoard,
                userBoard: userBoard,
                currentSolution: currentSolution
            };
            localStorage.setItem('sudoku_saved_game', JSON.stringify(gameState));
        }

        function clearGameState() {
            localStorage.removeItem('sudoku_saved_game');
        }

        function resetGame() {
            if(confirm("Tüm ilerlemeni sıfırlamak ve baştan başlamak istediğine emin misin? (Altınların ve ipuçların da sıfırlanacak)")) {
                localStorage.removeItem('sudoku_level');
                localStorage.removeItem('sudoku_gold');
                localStorage.removeItem('sudoku_free_hints');
                clearGameState();
                
                currentLevel = 1;
                userGold = 100;
                freeHints = 5;
                
                renderMap();
                setTimeout(scrollToActiveNode, 100);
            }
        }

        function openLevel(id) {
            let config = getLevelConfig(id);
            playingLevelId = id;
            document.getElementById('modal-level').innerText = id;
            document.getElementById('modal-difficulty').innerText = config.diff;
            
            let isLoaded = false;
            const savedGameJSON = localStorage.getItem('sudoku_saved_game');
            if (savedGameJSON) {
                try {
                    const savedGame = JSON.parse(savedGameJSON);
                    if (savedGame && savedGame.levelId === id) {
                        currentSolution = savedGame.currentSolution;
                        initialBoard = savedGame.initialBoard;
                        userBoard = savedGame.userBoard;
                        isLoaded = true;
                    }
                } catch (e) {
                    console.error("Kayıtlı oyun yüklenirken hata oluştu.");
                }
            }
            
            if (!isLoaded) {
                let data = SudokuGen.generate(config.diff);
                currentSolution = data.solution.map(r => [...r]);
                initialBoard = data.puzzle.map(r => [...r]);
                userBoard = data.puzzle.map(r => [...r]);
                saveGameState(); 
            }

            selectedCell = null;
            updateUI();
            renderBoard();
            
            const modal = document.getElementById('sudoku-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('sudoku-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            playingLevelId = null;
            selectedCell = null;
        }

        function useHint() {
            let availableCells = [];
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    if (userBoard[r][c] !== currentSolution[r][c]) {
                        availableCells.push({r, c});
                    }
                }
            }

            if (availableCells.length === 0) return; 

            if (freeHints > 0) {
                freeHints--;
                localStorage.setItem('sudoku_free_hints', freeHints);
            } else if (userGold >= 20) {
                userGold -= 20;
                localStorage.setItem('sudoku_gold', userGold);
            } else {
                alert("İpucu almak için yeterli altınınız yok! (Oyun kazanarak altın elde edebilirsin)");
                return;
            }

            let randomCell = availableCells[Math.floor(Math.random() * availableCells.length)];
            let correctNum = currentSolution[randomCell.r][randomCell.c];
            
            initialBoard[randomCell.r][randomCell.c] = correctNum;
            userBoard[randomCell.r][randomCell.c] = correctNum;

            saveGameState(); 
            updateUI();
            renderBoard();

            setTimeout(() => {
                let conflicts = calculateConflicts();
                let isFull = userBoard.every(row => row.every(val => val !== 0));
                if(isFull && conflicts.size === 0) handleWin();
            }, 300);
        }

        function calculateConflicts() {
            let conf = new Set();
            for(let r=0; r<9; r++) {
                for(let c=0; c<9; c++) {
                    let val = userBoard[r][c];
                    if(val === 0) continue;
                    
                    for(let i=0; i<9; i++) { if(i !== c && userBoard[r][i] === val) conf.add(`${r}-${c}`); }
                    for(let i=0; i<9; i++) { if(i !== r && userBoard[i][c] === val) conf.add(`${r}-${c}`); }
                    
                    let br = Math.floor(r/3)*3;
                    let bc = Math.floor(c/3)*3;
                    for(let i=0; i<3; i++) {
                        for(let j=0; j<3; j++) {
                            let nr = br+i; let nc = bc+j;
                            if((nr !== r || nc !== c) && userBoard[nr][nc] === val) conf.add(`${r}-${c}`);
                        }
                    }
                }
            }
            return conf;
        }

        function renderBoard() {
            const boardEl = document.getElementById('sudoku-board');
            boardEl.innerHTML = '';
            
            let conflicts = calculateConflicts();
            
            for(let r=0; r<9; r++) {
                for(let c=0; c<9; c++) {
                    let val = userBoard[r][c];
                    let isFixed = initialBoard[r][c] !== 0;
                    let isSelected = selectedCell && selectedCell.r === r && selectedCell.c === c;
                    
                    let isError = conflicts.has(`${r}-${c}`) && !isFixed;
                    
                    let div = document.createElement('div');
                    div.className = 'sudoku-cell';
                    div.dataset.row = r;
                    div.dataset.col = c;
                    
                    if(val !== 0) div.innerText = val;
                    
                    if (isFixed) {
                        div.classList.add('text-slate-900', 'bg-slate-100/50');
                    } else {
                        div.classList.add('text-indigo-600');
                    }
                    
                    if (isError) {
                        div.classList.add('bg-red-100', 'text-red-700');
                        div.classList.remove('text-indigo-600');
                    } else if (isSelected) {
                        div.classList.add('cell-selected');
                    }
                    
                    div.onclick = () => {
                        if (isFixed) return;
                        selectedCell = {r, c};
                        renderBoard(); 
                    };
                    
                    boardEl.appendChild(div);
                }
            }

            const numpad = document.getElementById('numpad-container');
            if(numpad) {
                if(selectedCell) {
                    numpad.classList.remove('opacity-50', 'pointer-events-none');
                } else {
                    numpad.classList.add('opacity-50', 'pointer-events-none');
                }
            }
        }

        function handleInput(num) {
            if(!selectedCell || initialBoard[selectedCell.r][selectedCell.c] !== 0) return; 
            
            userBoard[selectedCell.r][selectedCell.c] = num;
            saveGameState(); 
            renderBoard();
            
            if(num !== 0) {
                setTimeout(() => {
                    let conflicts = calculateConflicts();
                    let isFull = userBoard.every(row => row.every(val => val !== 0));
                    if(isFull && conflicts.size === 0) handleWin();
                }, 200);
            }
        }

        function handleWin() {
            confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 }, colors: ['#4f46e5', '#10b981', '#f59e0b'] });
            
            clearGameState(); 

            let config = getLevelConfig(playingLevelId);
            let reward = config.diff === 'basit' ? 20 : (config.diff === 'orta' ? 10 : 5);
            
            // HATA BURADAYDI, playingLevelId'yi kaydetmemiz gerekiyor
            let passedLevel = playingLevelId;

            if (passedLevel === currentLevel && currentLevel <= TOTAL_LEVELS) {
                userGold += reward;
                localStorage.setItem('sudoku_gold', userGold);
            } else {
                reward = 0; 
            }
            
            const boardEl = document.getElementById('sudoku-board');
            boardEl.innerHTML = `
                <div class="win-message flex flex-col items-center justify-center h-full w-full bg-emerald-50 rounded z-10 absolute inset-0">
                    <div class="text-6xl mb-3 drop-shadow-md">🎉</div>
                    <h3 class="text-3xl font-black mb-1 text-emerald-800">Harika!</h3>
                    <p class="font-semibold text-emerald-600 text-center px-4 mb-4">Seviye ${passedLevel} başarıyla tamamlandı.</p>
                    
                    ${reward > 0 ? `
                        <div class="bg-amber-100 text-amber-700 px-5 py-2.5 rounded-full font-black text-lg flex items-center gap-2 drop-shadow-sm animate-bounce">
                            🪙 +${reward} Altın
                        </div>
                    ` : ''}
                </div>
            `;
            
            setTimeout(() => {
                closeModal(); // Bu artık seviyeyi geçmeni engellemeyecek çünkü passedLevel'i tuttuk
                if(passedLevel === currentLevel && currentLevel < TOTAL_LEVELS) {
                    currentLevel++;
                    localStorage.setItem('sudoku_level', currentLevel);
                }
                renderMap();
                setTimeout(scrollToActiveNode, 300);
            }, 3000); 
        }

        document.addEventListener('keydown', (e) => {
            const modal = document.getElementById('sudoku-modal');
            if(modal.classList.contains('hidden') || !selectedCell) return;
            
            if(e.key >= '1' && e.key <= '9') handleInput(parseInt(e.key));
            else if(e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') handleInput(0);
        });

        function scrollToActiveNode() {
            const activeNode = document.getElementById(`node-${currentLevel}`);
            if(activeNode) {
                activeNode.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderMap();
            setTimeout(scrollToActiveNode, 200); 
        });
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker aktif!', reg))
                    .catch(err => console.error('SW hatası:', err));
            });
        }
    </script>
</body>
</html>
